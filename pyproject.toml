[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "astroml"
version = "2.0.0"
description = "Modern machine learning for automated galaxy classification and photometric redshift prediction"
authors = ["Data-Driven Astronomy Contributors"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/VikramxD/Data-Driven-Astronomy"
repository = "https://github.com/VikramxD/Data-Driven-Astronomy"
keywords = ["astronomy", "machine-learning", "deep-learning", "galaxy-classification", "computer-vision"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = "^3.10"
# Core ML
torch = "^2.2.0"
torchvision = "^0.17.0"
scikit-learn = "^1.4.0"
numpy = "^1.26.0"
pandas = "^2.2.0"
# Astronomy
astropy = "^6.0.0"
# API & Web
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
streamlit = "^1.31.0"
gradio = "^4.19.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.1.0"
# Data Processing
polars = "^0.20.0"
pyarrow = "^15.0.0"
pillow = "^10.2.0"
opencv-python = "^4.9.0"
albumentations = "^1.4.0"
# MLOps
mlflow = "^2.10.0"
optuna = "^3.5.0"
tensorboard = "^2.16.0"
# Visualization
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
plotly = "^5.18.0"
# Configuration
hydra-core = "^1.3.0"
omegaconf = "^2.3.0"
# Utilities
tqdm = "^4.66.0"
click = "^8.1.0"
loguru = "^0.7.0"
python-dotenv = "^1.0.0"
httpx = "^0.26.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.0"
pytest-mock = "^3.12.0"
hypothesis = "^6.98.0"
# Code Quality
ruff = "^0.2.0"
black = "^24.1.0"
mypy = "^1.8.0"
pre-commit = "^3.6.0"
# Documentation
mkdocs = "^1.5.0"
mkdocs-material = "^9.5.0"
mkdocstrings = {extras = ["python"], version = "^0.24.0"}
# Jupyter
jupyter = "^1.0.0"
ipykernel = "^6.29.0"
ipywidgets = "^8.1.0"

[tool.poetry.group.deploy.dependencies]
# Deployment
gunicorn = "^21.2.0"
celery = {extras = ["redis"], version = "^5.3.0"}
redis = "^5.0.0"
prometheus-client = "^0.19.0"

[tool.poetry.scripts]
astroml-train = "astroml.cli.train:main"
astroml-predict = "astroml.cli.predict:main"
astroml-api = "astroml.cli.api:main"
astroml-web = "astroml.cli.web:main"

# Ruff configuration (ultra-fast linter)
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["ARG", "S"]

# Black configuration (code formatter)
[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# MyPy configuration (type checking)
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "astropy.*",
    "sklearn.*",
    "cv2.*",
    "albumentations.*",
    "mlflow.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "gpu: marks tests that require GPU",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
